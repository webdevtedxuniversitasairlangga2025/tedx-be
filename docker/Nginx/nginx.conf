limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# Redirect semua HTTP ke HTTPS
server {
  listen 80;
  server_name _;
  return 301 https://$host$request_uri;
}

# Backend: api.tedxuniversitasairlangga.com
server {
  listen 443 ssl;
  server_name api.tedxuniversitasairlangga.com;

  ssl_certificate     /etc/letsencrypt/live/tedxuniversitasairlangga.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/tedxuniversitasairlangga.com/privkey.pem;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location / {
    limit_req zone=api_limit burst=20 nodelay;

    proxy_pass http://app:8888;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 15s;
    proxy_send_timeout 45s;
    proxy_read_timeout 45s;
  }
}

# Frontend: tedxuniversitasairlangga.com
server {
  listen 443 ssl;
  server_name tedxuniversitasairlangga.com;

  ssl_certificate     /etc/letsencrypt/live/tedxuniversitasairlangga.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/tedxuniversitasairlangga.com/privkey.pem;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # File frontend (dist/) — nanti di-mount ke /usr/share/nginx/html
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }
}