<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify Your Account</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f2f2f2;
        margin: 0;
        padding: 0;
      }
      .container {
        max-width: 600px;
        margin: 0 auto;
        padding: 20px;
        background-color: #ffffff;
        box-shadow: 0 0 10px rgba(226, 55, 55, 0.1);
        border-radius: 5px;
      }
      h1 {
        color: #333;
        font-size: 24px;
        margin-bottom: 20px;
      }
      p {
        color: #666;
        font-size: 16px;
        line-height: 1.5;
      }
      .otp {
        font-size: 32px;
        font-weight: bold;
        letter-spacing: 8px;
        color: #333;
        background-color: #f2f2f2;
        padding: 15px 25px;
        border-radius: 5px;
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Verify Your Account</h1>
      <p>Hello, {{ .Email }}</p>
      <p>
        Thank you for registering! Use the verification code below to complete
        your registration and activate your account:
      </p>
      <div align="center">
        <span class="otp">{{ .Code }}</span>
      </div>
      <p>This code expires in 15 minutes. If you did not request this, please ignore this email.</p>
    </div>
  </body>
</html>
