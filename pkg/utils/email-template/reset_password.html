<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Your Password</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f2f2f2;
        margin: 0;
        padding: 0;
      }
      .container {
        max-width: 600px;
        margin: 0 auto;
        padding: 20px;
        background-color: #ffffff;
        box-shadow: 0 0 10px rgba(226, 55, 55, 0.1);
        border-radius: 5px;
      }
      h1 {
        color: #333;
        font-size: 24px;
        margin-bottom: 20px;
      }
      p {
        color: #666;
        font-size: 16px;
        line-height: 1.5;
      }
      .btn {
        display: inline-block;
        background-color: #e23737;
        color: #ffffff;
        text-decoration: none;
        font-size: 16px;
        font-weight: bold;
        padding: 14px 30px;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Reset Your Password</h1>
      <p>Hello, {{ .Email }}</p>
      <p>
        We received a request to reset your password. Click the button below to
        choose a new password:
      </p>
      <div align="center">
        <a class="btn" href="{{ .ResetURL }}">Reset Password</a>
      </div>
      <p>
        This link expires in 15 minutes. If you did not request this, please
        ignore this email.
      </p>
    </div>
  </body>
</html>
