info:
  name: Get Ticket By ID
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/tickets/{{ticket_id}}"
  auth: inherit

runtime:
  variables:
    - name: base_url
      value: http://localhost:8888/api/v1
    - name: ticket_id
      value: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
