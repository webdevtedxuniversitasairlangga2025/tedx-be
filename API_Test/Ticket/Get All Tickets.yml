info:
  name: Get All Tickets
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/tickets?is_active=true"
  params:
    - name: is_active
      value: "true"
      type: query
  auth: inherit

runtime:
  variables:
    - name: base_url
      value: http://localhost:8888/api/v1

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
