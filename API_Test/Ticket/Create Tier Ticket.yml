info:
  name: Create Ticket Tier
  type: http
  seq: 6

http:
  method: POST
  url: "{{base_url}}/tickets/{{ticket_id}}/tiers"
  body:
    type: json
    data: |-
      {
        "tier": "VIP",
        "price": "250000.00",
        "quota": 50,
        "sale_start": "2026-01-01T00:00:00Z",
        "sale_end": "2026-03-01T00:00:00Z"
      }
  headers:
    - name: Authorization
      value: "Bearer {{access_token}}"

runtime:
  variables:
    - name: base_url
      value: http://localhost:8888/api/v1
    - name: ticket_id
      value: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
