info:
  name: Update Ticket Tier
  type: http
  seq: 7

http:
  method: PATCH
  url: "{{base_url}}/tickets/{{ticket_id}}/tiers/{{tier_id}}"
  body:
    type: json
    data: |-
      {
        "tier": "VIP",
        "price": "275000.00",
        "quota": 60,
        "is_active": true
      }
  headers:
    - name: Authorization
      value: "Bearer {{access_token}}"

runtime:
  variables:
    - name: base_url
      value: http://localhost:8888/api/v1
    - name: ticket_id
      value: ""
    - name: tier_id
      value: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
