info:
  name: Get Category By ID
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/categories/{{category_id}}"
  auth: inherit

runtime:
  variables:
    - name: base_url
      value: http://localhost:8888/api/v1
    - name: category_id
      value: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
