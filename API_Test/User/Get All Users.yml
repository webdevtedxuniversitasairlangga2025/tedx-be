info:
  name: Get All Users
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/users?page=1&per_page=10"
  params:
    - name: page
      value: "1"
      type: query
    - name: per_page
      value: "10"
      type: query
    - name: search
      value: ""
      type: query
    - name: role
      value: ""
      type: query
  headers:
    - name: Authorization
      value: Bearer {{access_token}}

runtime:
  variables:
    - name: base_url
      value: http://localhost:8888/api/v1

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
