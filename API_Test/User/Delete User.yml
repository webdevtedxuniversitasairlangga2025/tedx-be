info:
  name: Delete User
  type: http
  seq: 4

http:
  method: DELETE
  url: "{{base_url}}/users/{{user_id}}"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}

runtime:
  variables:
    - name: base_url
      value: http://localhost:8888/api/v1
    - name: user_id
      value: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
