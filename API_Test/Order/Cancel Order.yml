info:
  name: Cancel Order
  type: http
  seq: 7

http:
  method: POST
  url: "{{base_url}}/orders/PASTE_ORDER_UUID/cancel"
  auth:
    type: bearer
    bearer:
      token: "{{access_token}}"

runtime:
  variables:
    - name: base_url
      value: http://localhost:8888/api/v1

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
