info:
  name: Upload Proof
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{base_url}}/orders/PASTE_ORDER_UUID/proof"
  body:
    type: json
    data: |-
      {
        "payment_proof_url": "https://example.com/bukti.jpg"
      }
  auth:
    type: bearer
    bearer:
      token: "{{access_token}}"

runtime:
  variables:
    - name: base_url
      value: http://localhost:8888/api/v1

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
