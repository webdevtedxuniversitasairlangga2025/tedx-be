info:
  name: Create Order
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/orders"
  body:
    type: json
    data: |-
      {
        "ticket_tier_id": "PASTE_TIER_UUID",
        "quantity": 2
      }
  auth:
    type: bearer
    bearer:
      token: "{{access_token}}"

runtime:
  variables:
    - name: base_url
      value: http://localhost:8888/api/v1

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
