info:
  name: Create Order
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/orders"
  body:
    type: json
    data: |-
      {
        "ticket_tier_id": "627647a3-662d-408c-8dc9-fb74b1a1e805",
        "quantity": 3,
        "buyer_name": "Nama dari form IdentifyStepper",
        "buyer_email": "buyerForm@example.com",
        "buyer_phone": "081234567890"
      }
  auth:
    type: bearer
    bearer:
      token: "{{access_token}}"

runtime:
  variables:
    - name: base_url
      value: http://localhost:8888/api/v1

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
