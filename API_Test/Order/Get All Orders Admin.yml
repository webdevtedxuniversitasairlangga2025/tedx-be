info:
  name: Get All Orders Admin
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}/orders/admin/all?status=awaiting_approval&page=1&per_page=10"
  params:
    - name: status
      value: "awaiting_approval"
      type: query
    - name: page
      value: "1"
      type: query
    - name: per_page
      value: "10"
      type: query
  auth:
    type: bearer
    bearer:
      token: "{{access_token}}"

runtime:
  variables:
    - name: base_url
      value: http://localhost:8888/api/v1

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
