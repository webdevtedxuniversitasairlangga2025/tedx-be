info:
  name: Reset Password
  type: http
  seq: 8

http:
  method: POST
  url: "{{base_url}}/auth/reset-password"
  body:
    type: json
    data: |-
      {
        "token": "{{reset_token}}",
        "new_password": "newpassword123"
      }
  auth: inherit

runtime:
  variables:
    - name: base_url
      value: http://localhost:8888/api/v1
    - name: reset_token
      value: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
