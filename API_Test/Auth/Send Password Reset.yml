info:
  name: Send Password Reset
  type: http
  seq: 7

http:
  method: POST
  url: "{{base_url}}/auth/send-password-reset"
  body:
    type: json
    data: |-
      {
        "email": "{{email}}"
      }
  auth: inherit

runtime:
  variables:
    - name: base_url
      value: http://localhost:8888/api/v1
    - name: email
      value: dejongfrenkie26@gmail.com

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
