info:
  name: Lookup Ticket
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/checkins/replace-with-ticket-code"
  headers:
    - name: Authorization
      value: "Bearer {{access_token}}"

runtime:
  variables:
    - name: base_url
      value: http://localhost:8888/api/v1

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
