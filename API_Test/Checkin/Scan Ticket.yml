info:
  name: Scan Ticket
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/checkins/scan"
  body:
    type: json
    data: |-
      {
        "ticket_code": "replace-with-paid-ticket-code"
      }
  headers:
    - name: Authorization
      value: "Bearer {{access_token}}"

runtime:
  variables:
    - name: base_url
      value: http://localhost:8888/api/v1

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
