info:
  name: Get All Todo
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/todos?page=1&per_page=10"
  params:
    - name: page
      value: "1"
      type: query
    - name: per_page
      value: "10"
      type: query
  auth:
    type: bearer
    bearer:
      token: "{{access_token}}"

runtime:
  variables:
    - name: base_url
      value: http://localhost:8888/api/v1

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
