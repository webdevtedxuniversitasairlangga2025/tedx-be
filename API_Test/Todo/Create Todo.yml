info:
  name: Create Todo
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/todos"
  body:
    type: json
    data: |-
      {
        "name": "Belajar Go",
        "category": "Learning"
      }
  auth:
    type: bearer
    bearer:
      token: "{{access_token}}"

runtime:
  variables:
    - name: base_url
      value: http://localhost:8888/api/v1

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
