info:
  name: Update Todo
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{base_url}}/todos/{{todo_id}}"
  body:
    type: json
    data: |-
      {
        "name": "Belajar Go lanjut",
        "category": "Learning",
        "is_done": true
      }
  auth:
    type: bearer
    bearer:
      token: "{{access_token}}"

runtime:
  variables:
    - name: base_url
      value: http://localhost:8888/api/v1
    - name: todo_id
      value: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
