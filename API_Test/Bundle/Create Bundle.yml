info:
  name: Create Bundle
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/bundles"
  body:
    type: json
    data: |-
      {
        "name": "Bundle Hemat TEDx",
        "description": "Paket kaos + totebag + sticker",
        "price": "150000.00"
      }
  auth:
    type: bearer
    bearer:
      token: "{{access_token}}"

runtime:
  variables:
    - name: base_url
      value: http://localhost:8888/api/v1

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
