info:
  name: Delete Bundle
  type: http
  seq: 7

http:
  method: DELETE
  url: "{{base_url}}/bundles/{{bundle_id}}"
  auth:
    type: bearer
    bearer:
      token: "{{access_token}}"

runtime:
  variables:
    - name: base_url
      value: http://localhost:8888/api/v1
    - name: bundle_id
      value: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
