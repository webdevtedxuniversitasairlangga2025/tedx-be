info:
  name: Upload Bundle Image File
  type: http
  seq: 8

http:
  method: POST
  url: "{{base_url}}/bundles/PASTE_BUNDLE_UUID/images/upload"
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value:
          - ./sample.jpg
  auth:
    type: bearer
    bearer:
      token: "{{access_token}}"

runtime:
  variables:
    - name: base_url
      value: http://localhost:8888/api/v1

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
