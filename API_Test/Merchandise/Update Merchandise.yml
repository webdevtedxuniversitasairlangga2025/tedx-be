info:
  name: Update Merchandise
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{base_url}}/merchandise/{{merchandise_id}}"
  body:
    type: json
    data: |-
      {
        "name": "T-Shirt TEDx UNAIR 2026 (Edisi Spesial)",
        "description": "Kaos eksklusif edisi terbatas bahan cotton combed 30s.",
        "price": "135000.00",
        "category": "t-shirt",
        "is_active": true
      }
  headers:
    - name: Authorization
      value: "Bearer {{access_token}}"

runtime:
  variables:
    - name: base_url
      value: http://localhost:8888/api/v1
    - name: merchandise_id
      value: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
