info:
  name: Get All Merchandise
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/merchandise?page=1&per_page=10&is_active=true"
  params:
    - name: page
      value: "1"
      type: query
    - name: per_page
      value: "10"
      type: query
    - name: is_active
      value: "true"
      type: query
  auth: inherit

runtime:
  variables:
    - name: base_url
      value: http://localhost:8888/api/v1

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
