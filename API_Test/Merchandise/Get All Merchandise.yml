info:
  name: Get All Merchandise
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/merchandise?is_active=true&category_id={{category_id}}"
  params:
    - name: is_active
      value: "true"
      type: query
    - name: category_id
      value: "{{category_id}}"
      type: query
  auth: inherit

runtime:
  variables:
    - name: base_url
      value: http://localhost:8888/api/v1

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
