info:
  name: Get Merchandise By ID
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}/merchandise/{{merchandise_id}}"
  auth: inherit

runtime:
  variables:
    - name: base_url
      value: http://localhost:8888/api/v1
    - name: merchandise_id
      value: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
